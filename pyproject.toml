[project]
name = "genvai"
version = "0.1.0"
description = "Generative, conversational video editor driven by a local LLM"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.5",      # ships an ffmpeg binary into the venv
    "pillow>=10.4",
]

[project.optional-dependencies]
# Local Stable Diffusion image generation (~3 GB). Install only where a GPU exists.
image = [
    "torch>=2.4",
    "diffusers>=0.31",
    "transformers>=4.45",
    "accelerate>=1.0",
    "safetensors>=0.4",
]
# Offline narration synthesis.
tts = ["piper-tts>=1.2"]
# Speech-to-text, for editing footage that already has dialogue.
asr = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
genvai = "genvai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genvai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# Typer's API requires Option()/Argument() calls in argument defaults.
"src/genvai/cli.py" = ["B008"]
